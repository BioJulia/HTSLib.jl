# Dependabot keeps the compat bounds of the Julia projects and the versions of the GitHub Actions current, with weekly pull requests.
version: 2
updates:
  # The package's workspace, whose projects, the tests and the documentation, Dependabot updates from the root, so they aren't listed apart, which would open a pull request for each.
  # The generator's environment, gen/, follows htslib_jll by hand, since its version must match the package's.
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
    # Dependabot takes the standard libraries' version for 0.0.0, and would widen their bounds to `<0.0.1, 1`.
    ignore:
      - dependency-name: "Test"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
